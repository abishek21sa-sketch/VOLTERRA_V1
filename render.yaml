# Render Blueprint (https://render.com/docs/blueprint-spec) for VOLTERRA.
#
# Deploys the Go API as a native web service, and (optionally) the Angular frontend as a static
# site. Both are live and credential-tested against a real Render account -- see README.md's
# "Deployment" section for details. /api/sites returns real NREL AFDC charging stations (Tesla's
# own site collection is blocked from cloud/datacenter IP ranges by Akamai bot detection -- a
# documented, disclosed, environment-specific limitation, not a code bug; see
# backend/internal/warehouse/warehouse.go). /api/demand still needs
# ml/data/queue_risk_predictions.json, which is not yet produced from real data.
#
# Not included on purpose: Memgraph and Redpanda (docker-compose.yml). Only one backend route
# (POST /api/copilot's network_resilience tool) ever touches Memgraph, and only when an
# ANTHROPIC_API_KEY or GEMINI_API_KEY is configured -- everything else this blueprint deploys
# (/health, /api/sites, /api/demand, /api/governance/signature, /api/copilot's deterministic
# fallback, /api/copilot/status) works with no graph database or event bus running at all. See
# backend/cmd/api/main.go and backend/internal/graphdb for why: graphdb.NewClient connects
# lazily, so its absence never blocks startup or any other route.

services:
  # --- Backend: Go + Fiber API (backend/cmd/api) ---
  - type: web
    name: volterra-backend
    runtime: go
    plan: free
    rootDir: backend
    # internal/warehouse shells out to the `duckdb` CLI (no CGO driver in use -- see that
    # package's doc comment) so the build step fetches the same CLI version this project
    # developed against (DuckDB CLI 1.5.5, per CLAUDE.md) as a portable Linux binary.
    buildCommand: >-
      curl -fsSL -o /tmp/duckdb_cli.zip
      https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip &&
      mkdir -p bin && unzip -o /tmp/duckdb_cli.zip -d bin && chmod +x bin/duckdb &&
      go build -o bin/api ./cmd/api
    startCommand: ./bin/api
    healthCheckPath: /health
    envVars:
      # Render injects PORT itself for native web services; main.go already reads it (falls
      # back to 8080 locally) -- do not set PORT here.
      - key: VOLTERRA_DUCKDB_PATH
        value: bin/duckdb
      # warehouse/volterra.duckdb is committed directly (see .gitignore's comment on why --
      # unlike AUTOMOTIVE_PRODUCT_V1's 644MB warehouse, this one is ~18MB, comfortably under
      # GitHub's 100MB limit) built from real NREL AFDC / FHWA / EIA / EPA / NREL ATB data. See
      # warehouse/build_warehouse.py and README.md's Deployment section for how to refresh it.
      - key: VOLTERRA_WAREHOUSE_PATH
        value: ../warehouse/volterra.duckdb
      # NOT bundled by this blueprint either -- same README section. Until this path holds the
      # real predictions file, GET /api/demand returns a clear 500, not fake data.
      - key: VOLTERRA_QUEUE_RISK_PREDICTIONS_PATH
        value: ../ml/data/queue_risk_predictions.json
      # Set this to your deployed frontend's real origin (Vercel or Render static site) once you
      # have it -- CORS blocks everything else by default.
      - key: VOLTERRA_CORS_ORIGIN
        value: https://REPLACE-WITH-YOUR-FRONTEND-ORIGIN
      # Optional. Leave unset to keep POST /api/copilot on its deterministic fallback (no
      # external LLM call, no Memgraph dependency). Set only one of ANTHROPIC_API_KEY /
      # GEMINI_API_KEY-or-GOOGLE_API_KEY; main.go prefers Gemini when present.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Optional, and only relevant once one of the keys above is set. Without a real Memgraph
      # instance reachable at this URI, the copilot's network_resilience tool call fails
      # per-request (clear error) rather than crashing the service -- see README.md.
      - key: VOLTERRA_MEMGRAPH_URI
        sync: false

  # --- Frontend: Angular + MapLibre GL static build (frontend/) ---
  # Vercel is an equally valid (arguably simpler) home for this -- see vercel.json and README.md's
  # Deployment section. Both are provided; use one, not both, to avoid two live CORS origins.
  - type: web
    name: volterra-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/frontend/browser
    envVars:
      # Render's default Node (24.14.1 as of this writing) is one patch behind what this
      # Angular CLI version requires (>=24.15.0) and fails the build outright -- pin explicitly
      # rather than float on Render's default and re-break on the next Node bump.
      - key: NODE_VERSION
        value: 24.15.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
